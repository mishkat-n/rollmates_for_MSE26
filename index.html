<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollmate Finder for RUET MSE'26 Series</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f4;--ink:#13222d;--mute:#5b6b77;--card:#fff;--line:#c9d5dd;--blue:#1d4ed8;--heat:#f2a900;--fb:#1877f2;--li:#0a66c2;--ph:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#10202b;--ink:#e8eef2;--mute:#9db0bd;--card:#18303f;--line:#2b4556;--blue:#6e9bff}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header.hero{position:relative;padding:72px 0 64px;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--line) 2px,transparent 2.5px) 0 0/34px 34px;mask-image:linear-gradient(#000 30%,transparent)}
.hero .wrap{position:relative}
.logo{display:block;height:clamp(96px,22vw,150px);width:auto;margin:0 auto 18px}
.hero{text-align:center}
h1{font-size:clamp(1.7rem,6vw,3rem);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}
.hero p.sub{max-width:34ch;font-size:1.1rem;margin:16px auto 26px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:8px;text-decoration:none;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--heat);outline-offset:2px}
section{padding:44px 0;border-top:1px solid var(--line)}
h2{font-size:1.9rem;margin:0 0 6px;letter-spacing:-.02em}
.hint{color:var(--mute);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:180px;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.results{margin-top:20px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card.mate{border-left:6px solid var(--heat)}
.card b{font-size:1.15rem;display:block}
.card small{display:block;color:var(--mute)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;color:#fff;text-decoration:none;transition:transform .15s}
.ic:hover{transform:translateY(-2px)}
.ic svg{width:20px;height:20px;display:block}
.ic.fb{background:var(--fb)}
.ic.li{background:var(--li)}
.ic.ph{background:var(--ph);width:auto;border-radius:999px;padding:0 14px 0 11px;gap:8px;font-size:.95rem;font-weight:600}
.main{width:100%}
.msg{color:var(--mute)}
footer{margin-top:auto;text-align:center;padding:30px 0 50px;color:var(--mute);border-top:1px solid var(--line)}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeLink = (u, host) => new RegExp("^https://([a-z0-9-]+\\.)?" + host + "/", "i").test(u) ? u : "";

const ICON = {
  fb: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.9.4-1.7 1.8-1.7h1.6V3.8s-1.4-.3-2.8-.3c-2.8 0-4.5 1.7-4.5 4.7v2.3H6.7v3.3h2.9V22h3.9z"/></svg>',
  li: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.4 8.6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM3.7 10.3h3.4V20H3.7v-9.7zm5.5 0h3.2v1.4c.5-.9 1.6-1.7 3.2-1.7 3.3 0 3.9 2.2 3.9 5V20h-3.4v-4.2c0-1.1 0-2.5-1.500-2.5s-1.800 1.2-1.800 2.4V20H9.200v-9.700z"/></svg>',
  ph: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
};

const card = (p, label) => {
  const [roll, name, fb, li, ph] = p;
  const fbU = safeLink(fb, "facebook\\.com"), liU = safeLink(li, "linkedin\\.com");
  const icons =
    (fbU ? `<a class="ic fb" href="${esc(fbU)}" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook">${ICON.fb}</a>` : "") +
    (liU ? `<a class="ic li" href="${esc(liU)}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">${ICON.li}</a>` : "") +
    (ph  ? `<a class="ic ph" href="https://wa.me/${esc(ph)}" target="_blank" rel="noopener" aria-label="WhatsApp +${esc(ph)}" title="WhatsApp">${ICON.ph}<span>+${esc(ph)}</span></a>` : "");
  return `<div class="card mate"><small>${label}</small><b>${name ? esc(name) : "Rollmate not found yet!"}</b>` +
    `<small>${esc(roll)}</small>` + (icons ? `<div class="links">${icons}</div>` : "") + `</div>`;
};

document.title = CONFIG.title;
$("title").textContent = CONFIG.title;
$("tagline").textContent = CONFIG.tagline;
$("foot").textContent = CONFIG.footer;

function findRoll(){
  const q = $("rollIn").value.replace(/\s/g, "");
  const out = $("rollOut");
  if(!q){ out.innerHTML = '<p class="msg">Type your roll number first.</p>'; return; }
  const target = q.startsWith(JUNIOR_PREFIX) ? SENIOR_PREFIX + q.slice(JUNIOR_PREFIX.length) : q;
  const p = SENIORS.find(s => s[0] === target);
  out.innerHTML = p ? card(p, "Your rollmate")
                    : '<p class="msg">No match for ' + esc(q) + '. Check the number and try again.</p>';
}

function findSenior(){
  const q = $("senIn").value.trim().toLowerCase();
  const out = $("senOut");
  if(!q){ out.innerHTML = '<p class="msg">Type a name to search.</p>'; return; }
  const hits = SENIORS.filter(s => s[1] && s[1].toLowerCase().includes(q));
  out.innerHTML = hits.length ? hits.slice(0, 20).map(s => card(s, "Senior")).join("")
                              : '<p class="msg">No senior found for "' + esc(q) + '".</p>';
}

$("rollBtn").onclick = findRoll;
$("senBtn").onclick = findSenior;
$("rollIn").addEventListener("keydown", e => { if(e.key === "Enter") findRoll(); });
$("senIn").addEventListener("keydown", e => { if(e.key === "Enter") findSenior(); });
</script>
